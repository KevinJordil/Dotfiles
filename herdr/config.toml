# herdr : onglets principaux = workspaces (sidebar), sous-onglets = tabs.
# Thème de herdr.dev : catppuccin + accent mauve ; Guake assorti (palette Catppuccin Mocha, fond #11111b opaque)
onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
accent = "#cba6f7"
sidebar_bg = "#181825"
surface0 = "#1e1e2e"  # tabs inactifs sans pavé (comme herdr.dev)
panel_bg = "#1e1e2e"  # barre des tabs
active_row_bg = "#45385e"  # agent sélectionné et space actif : violet sombre, assorti à l'accent mauve

[terminal]
new_cwd = "follow"  # nouveau tab/pane dans le dossier courant

[keys]
switch_tab = "alt+1..9"
switch_workspace = "ctrl+alt+1..9"
move_tab_previous = "prefix+shift+left"  # réordonner les tabs (et donc les agents)
move_tab_next = "prefix+shift+right"

[ui]
prompt_new_tab_name = false
# date/heure (Ghostty n'a pas la barre de Guake), précédée d'un trait : herdr ne permet pas de lui donner un autre fond
tab_bar_right = [{ type = "text", text = "│" }, { type = "datetime", format = "%a %d.%m.%Y %H:%M:%S " }]
sidebar_width = 34  # place pour le titre des sessions Claude

# sidebar comme herdr.dev : une ligne vide entre les entrées, agents en « état · agent »
[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
# en blanc : space · tab (séparateur « · » imposé par herdr)
row_gap = 1
rows = [["state_icon", { token = "workspace", fg = "#ffffff" }, { token = "tab", fg = "#ffffff" }], ["state_text", "agent"]]

# Claude, 3 lignes (tokens envoyés par bin/herdr-agents) :
#   icône d'état + sujet de la session : blanc ● idle, orange spinner en cours, rouge ✘ bloqué, vert ✔ fini ;
#   dernière demande ; sous-agents et shells encore ouverts.
[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "$t_idle", fg = "#ffffff", bold = false }, { token = "$t_working", fg = "#fab387" },
   { token = "$t_blocked", fg = "#f38ba8", bold = true }, { token = "$t_done", fg = "#a6e3a1", bold = true }, { token = "$t_unknown", dim = true }],
  [{ token = "$last", fg = "#bac2de", bold = false, dim = false }],
  [{ token = "$subagents", fg = "#cba6f7" }, { token = "$shells", fg = "#fab387" }],
]

[experimental]
kitty_graphics = true
pane_history = true  # contenu des panes conservé après redémarrage
