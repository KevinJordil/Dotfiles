set -g mouse on               # souris
# pas de set orphelin qui tourne en fond : au détachement, tue les sets sans client
# (pas destroy-unattached : il tuerait les sets restaurés avant que leur onglet s'y rattache)
set-hook -g client-detached "run-shell 'tmux ls -F \"##{?session_attached,,##{session_name}}\" | xargs -rI{} tmux kill-session -t ={}'"
set -g automatic-rename-format '#{b:pane_current_path}#{?#{==:#{pane_current_command},zsh},,·#{pane_current_command}}'  # dossier·programme (dossier seul au repos)
set -g copy-command 'xclip -in -selection clipboard'  # sélection souris → presse-papier
# clic droit sur un onglet : menu à la position de la souris (défaut : à gauche de l'onglet)
run-shell "tmux list-keys -T root | grep -E \"^bind-key +-T root +(M-)?MouseDown3Status \" | sed 's/-x W -y W/-x M -y W/' | tmux source -"

# Barre d'onglets : minimal sombre, accordée à Guake (avant continuum, qui s'ajoute à status-right)
set -g status-style 'bg=#2e3440,fg=#9aa3b5'
set -g status-left ''
set -g status-right ''
# onglets en largeur égale, texte centré : @tab est calculé par ~/.tmux/tabs.sh (format tmux incapable de le faire)
set -g window-status-format '#{@tab}'
set -g window-status-current-format '#[fg=#1c1c1c,bg=#86aed6,bold]#{@tab}'
set -g status-left-length 0
set -g status-right-length 0
set -g window-status-separator '#[fg=#5c6370]│'  # trait entre onglets (1 colonne, déduite dans tabs.sh)
set -g pane-border-style 'fg=#3a3a3a'
set -g pane-active-border-style 'fg=#86aed6'
set -g message-style 'bg=#262626,fg=#dedddA'
set-hook -g after-new-window 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g window-unlinked 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g window-renamed 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g client-resized 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g client-attached 'run-shell -b ~/.tmux/tabs.sh'

# Persistance après redémarrage : sauvegarde auto toutes les 5 min (restauration lancée par ~/.zshrc)
set -g @continuum-save-interval '5'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
