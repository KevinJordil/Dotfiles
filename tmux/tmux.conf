set -g mouse on               # souris
set -g base-index 1           # fenêtres numérotées à partir de 1, comme les onglets Guake
set -g renumber-windows on    # pas de trou dans la numérotation après une fermeture
# pas de set orphelin qui tourne en fond : au détachement, tue les sets sans client
# (pas destroy-unattached : il tuerait les sets restaurés avant que leur onglet s'y rattache)
set-hook -g client-detached "run-shell 'tmux ls -F \"##{?session_attached,,##{session_name}}\" | xargs -rI{} tmux kill-session -t ={}'"
set -g automatic-rename-format '#{b:pane_current_path}#{?#{==:#{pane_current_command},zsh},,·#{pane_current_command}}'  # dossier·programme (dossier seul au repos)
set -g copy-command 'xclip -in -selection clipboard'  # sélection souris → presse-papier
# clic molette : colle le presse-papier système (sauf si l'appli du pane gère la souris, ex. vim)
bind -n MouseDown2Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { run-shell "xclip -o -selection clipboard | tmux load-buffer -b clip - && tmux paste-buffer -p -d -b clip -t '#{pane_id}'" }
# clic droit sur un onglet : menu à la position de la souris (défaut : à gauche de l'onglet), reste ouvert au relâchement (-O)
run-shell "tmux list-keys -T root | grep -E \"^bind-key +-T root +(M-)?MouseDown3Status \" | sed 's/-x W -y W/-O -x M -y W/' | tmux source -"

# Barre d'onglets : minimal sombre, accordée à Guake (avant continuum, qui s'ajoute à status-right)
set -g status-style 'bg=#2e3440,fg=#9aa3b5'
set -g status-left ''
set -g status-right ''
# onglets en largeur égale, texte centré : @tab est calculé par ~/.tmux/tabs.sh (format tmux incapable de le faire)
set -g window-status-format '#{@tab}'
set -g window-status-current-format '#[fg=#1c1c1c,bg=#86aed6,bold]#{@tab}'
set -g status-left-length 0
set -g status-right-length 0
set -g window-status-separator '#[fg=#5c6370]│'  # trait entre onglets (1 colonne, déduite dans tabs.sh)
set -g pane-border-style 'fg=#3a3a3a'
set -g pane-active-border-style 'fg=#86aed6'
set -g message-style 'bg=#262626,fg=#dedddA'
set-hook -g after-new-window 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g window-unlinked 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g window-renamed 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g client-resized 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g client-attached 'run-shell -b ~/.tmux/tabs.sh'
set-hook -g session-window-changed 'run-shell -b ~/.tmux/tabs.sh'  # couvre aussi le glisser (numéros à jour)

# onglets à la souris, comme Guake : glisser = réorganiser (la fenêtre glissée suit la souris), double-clic = renommer (nom fixe)
# (source explicite : dans un raccourci souris, la fenêtre « courante » par défaut est celle sous la souris)
bind -n MouseDrag1Status if -F '#{!=:#{window_index},#{active_window_index}}' { run-shell "tmux swap-window -d -s '#{session_id}:#{active_window_index}' -t '#{session_id}:#{window_index}'" }
# nouvelle fenêtre / découpage dans le dossier courant
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# idem dans les menus du clic droit (New Window, Horizontal/Vertical Split) ; lignes déjà traitées ignorées au re-source
run-shell "tmux list-keys -T root | grep -E 'new-window|split-window' | grep -v pane_current_path | sed -E 's/(new-window|split-window)( -[ahv])?/& -c \\\"##{pane_current_path}\\\"/g' | tmux source -"
bind -n DoubleClick1Status { select-window -t = ; command-prompt -I "#W" -p "Nom :" { rename-window -- "%%" } }

# Persistance après redémarrage : sauvegarde auto toutes les 5 min (restauration lancée par ~/.zshrc)
set -g @continuum-save-interval '5'
# + sauvegarde immédiate quand un set est renommé ou une fenêtre ouverte (sinon un redémarrage peut repartir d'un état vieux de 5 min)
# pas sur window-unlinked : à la fermeture de Guake, les sets sont détruits un par un et on sauvegarderait un état vide
# index [9] : s'ajoute aux hooks existants sans doublon au re-source
set-hook -g session-renamed[9] 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'
set-hook -g after-new-window[9] 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'
set-hook -g after-split-window[9] 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
