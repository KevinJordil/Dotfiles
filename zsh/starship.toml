# Starship : même mise en page que l'ancien Powerlevel10k (lean), couleurs Catppuccin Mocha (comme herdr et Ghostty).
# Ligne 1 : conteneur, dossier, git, contexte Docker. Ligne 2 : ❯, et à droite code de retour, durée, jobs, heure.
# La partie droite reste sur la ligne de saisie : une 1re ligne pleine largeur serait redécoupée
# par herdr au resize d'un split et le prompt se répéterait.
"$schema" = 'https://starship.rs/config-schema.json'

format = """$container$directory$git_branch$git_commit$git_state$git_status$git_metrics$docker_context\
$line_break$character"""
right_format = "$status$cmd_duration$jobs$time"
add_newline = false
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"

[container]  # dans un conteneur (ex. `it <conteneur>`)
symbol = "⬢ "
style = "bold red"
format = "[$symbol$name]($style) "

[directory]
style = "bold blue"
read_only = " "
truncation_length = 5
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]  # branche, et sa branche distante si le nom diffère
symbol = " "
style = "mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]  # tag sur le commit courant, ou hash si HEAD détachée
tag_disabled = false
tag_symbol = " "
style = "lavender"

[git_state]  # rebase / merge / cherry-pick en cours, avec progression
style = "bold peach"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
modified = "!${count}"
untracked = "?${count}"
staged = "[+${count}](green)"
deleted = "-${count}"
renamed = "»${count}"
conflicted = "[~${count}](bold red)"
stashed = "[*${count}](overlay1)"
ahead = "[⇡${count}](teal)"
behind = "[⇣${count}](peach)"
diverged = "[⇡${ahead_count}⇣${behind_count}](peach)"

[git_metrics]  # lignes ajoutées / supprimées non commitées
disabled = false
added_style = "green"
deleted_style = "red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[docker_context]  # contexte Docker autre que `default` (ex. stack distante)
symbol = " "
style = "sapphire"
only_with_files = false
format = "[$symbol$context]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[status]
disabled = false
symbol = "✘"
format = "[$symbol$status]($style) "
style = "red"

[cmd_duration]
min_time = 3_000
format = "[$duration]($style) "
style = "peach"

[jobs]
symbol = "⚙"
style = "teal"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style)"
style = "overlay1"
